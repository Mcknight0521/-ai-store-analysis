name: Apply analysis detail v5.12
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_analysis_detail_v512.py'
      - '.github/workflows/apply-analysis-detail-v512.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_analysis_detail_v512.py
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "opspilot-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix analysis detail tables v5.12"
          git push
