name: Apply anomaly rankings v5.19
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_anomaly_rankings_v519.py'
      - '.github/workflows/apply-anomaly-rankings-v519.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply safe anomaly ranking layer
        run: python scripts/patch_anomaly_rankings_v519.py
      - name: Verify generated anomaly layer
        run: |
          test -s index.html
          grep -q 'anomaly-rankings-v519-js' index.html
          grep -q '改善優先商品 Top 5' index.html
          grep -q '出清率超標 Top 20' index.html
          grep -q '報廢率超標 Top 20' index.html
          grep -q '損耗率超標 Top 20' index.html
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "opspilot-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Build anomaly rankings v5.19.1"
          git push