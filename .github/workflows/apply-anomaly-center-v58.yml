name: Apply anomaly center v5.8
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_anomaly_center_v58.py'
      - '.github/workflows/apply-anomaly-center-v58.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe anomaly center patch
        run: python scripts/patch_anomaly_center_v58.py
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "opspilot-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Build threshold-driven anomaly center"
          git push
