name: Remove overview loss breakdown
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_remove_overview_loss_v59.py'
      - '.github/workflows/apply-remove-overview-loss-v59.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_remove_overview_loss_v59.py
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "opspilot-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Remove overview loss breakdown"
          git push
