name: Apply priority and overview events v5.11
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_priority_events_v511.py'
      - '.github/workflows/apply-priority-events-v511.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_priority_events_v511.py
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "opspilot-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add improvement priority and move events to overview"
          git push
