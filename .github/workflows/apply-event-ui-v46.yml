name: Apply event UI v4.6

on:
  push:
    paths:
      - 'scripts/patch_event_ui_v46.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-event-ui-v46
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch event UI
        run: python scripts/patch_event_ui_v46.py
      - name: Commit patched index
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes"
            exit 0
          fi
          git config user.name "opspilot-event-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Merge same-day event labels and clarify severity"
          git push
