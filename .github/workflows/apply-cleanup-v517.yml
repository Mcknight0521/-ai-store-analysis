name: Apply cleanup v5.17
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_remove_duplicate_priority_interval_v517.py'
      - '.github/workflows/apply-cleanup-v517.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_remove_duplicate_priority_interval_v517.py
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "opspilot-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Remove duplicate improvement panel and interval Top 10 v5.17"
          git push
