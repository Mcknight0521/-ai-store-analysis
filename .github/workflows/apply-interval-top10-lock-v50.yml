name: Apply interval Top 10 lock v5.0
on:
  push:
    paths:
      - 'scripts/patch_interval_top10_lock_v50.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-interval-top10-lock-v50
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch_interval_top10_lock_v50.py
      - name: Commit patched index
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "opspilot-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Disable weekday weekend Top 10 for interval reports"
          git push
