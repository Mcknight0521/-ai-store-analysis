name: Apply anomaly Top 20 v5.16
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_anomaly_top20_v516.py'
      - '.github/workflows/apply-anomaly-top20-v516.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_anomaly_top20_v516.py
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "opspilot-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Redesign anomaly center as Top 20 v5.16"
          git push
