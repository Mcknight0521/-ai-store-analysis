name: Apply one-page overview v5.13
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_executive_summary_v513.py'
      - '.github/workflows/apply-executive-summary-v513.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_executive_summary_v513.py
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "opspilot-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Redesign first page as one-page overview v5.13"
          git push
