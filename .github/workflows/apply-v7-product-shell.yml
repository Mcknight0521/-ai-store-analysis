name: Apply OpsPilot full UI rebuild
on:
  push:
    branches: [main]
    paths:
      - 'assets/opspilot-v7.css'
      - 'assets/opspilot-v7.js'
      - 'assets/opspilot-structure.css'
      - 'assets/opspilot-display.css'
      - 'scripts/apply_v7_product_shell.py'
      - '.github/workflows/apply-v7-product-shell.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply full UI rebuild
        run: python scripts/apply_v7_product_shell.py
      - name: Verify UI refs
        run: |
          grep -q 'assets/opspilot-display.css?v=14.0.0' index.html
          grep -q 'assets/opspilot-v7.js?v=14.0.0' index.html
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "opspilot-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Build OpsPilot full UI rebuild"
          git push
