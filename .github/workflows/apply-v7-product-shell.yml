name: Apply OpsPilot structural presentation
on:
  push:
    branches: [main]
    paths:
      - 'assets/opspilot-v7.css'
      - 'assets/opspilot-v7.js'
      - 'assets/opspilot-structure.css'
      - 'scripts/apply_v7_product_shell.py'
      - '.github/workflows/apply-v7-product-shell.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply structural presentation
        run: python scripts/apply_v7_product_shell.py
      - name: Verify structural refs
        run: |
          grep -q 'assets/opspilot-v7.css?v=11.0.0' index.html
          grep -q 'assets/opspilot-structure.css?v=12.0.0' index.html
          grep -q 'assets/opspilot-v7.js?v=12.0.0' index.html
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "opspilot-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Build OpsPilot structural presentation"
          git push
