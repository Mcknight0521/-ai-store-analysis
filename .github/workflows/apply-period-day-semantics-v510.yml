name: Apply period day semantics v5.10
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_period_day_semantics_v510.py'
      - '.github/workflows/apply-period-day-semantics-v510.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_period_day_semantics_v510.py
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "opspilot-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Clarify report coverage and daily averages"
          git push
