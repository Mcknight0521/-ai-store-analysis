name: Apply event engine v4.5

on:
  push:
    paths:
      - 'scripts/patch_event_engine_v45.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-event-engine-v45
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch event engine
        run: python scripts/patch_event_engine_v45.py
      - name: Commit patched index
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes"
            exit 0
          fi
          git config user.name "opspilot-event-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix event matching by full date and region"
          git push
