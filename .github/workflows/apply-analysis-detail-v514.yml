name: Apply robust analysis detail v5.14
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_analysis_detail_v514.py'
      - '.github/workflows/apply-analysis-detail-v514.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_analysis_detail_v514.py
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "opspilot-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Make analysis detail robust v5.14"
          git push
