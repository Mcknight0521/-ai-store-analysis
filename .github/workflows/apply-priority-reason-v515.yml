name: Apply priority reasons v5.15
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_priority_reason_v515.py'
      - '.github/workflows/apply-priority-reason-v515.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_priority_reason_v515.py
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "opspilot-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Show improvement reasons instead of scores v5.15"
          git push
