name: Apply OpsPilot UI and Insights v5.21
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_ui_unify_insights_v521.py'
      - '.github/workflows/apply-ui-insights-v521.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply UI v5.21
        run: python scripts/patch_ui_unify_insights_v521.py
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "opspilot-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Build unified UI and Insights 2.0 v5.21"
          git push
